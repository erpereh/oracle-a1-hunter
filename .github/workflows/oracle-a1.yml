name: Oracle A1 Hunter

on:
  workflow_dispatch:

  schedule:
    # Reintento de capacidad cada ~5 minutos
    - cron: "2-57/5 * * * *"

    # Dos ventanas para enviar el resumen a las 20:13 de Madrid
    # tanto en horario de verano (UTC+2) como de invierno (UTC+1).
    - cron: "13 18 * * *"
    - cron: "13 19 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-a1-hunter
  cancel-in-progress: false

jobs:
  hunt:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2-57/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --quiet --disable-pip-version-check oci-cli

      - name: Configure OCI
        shell: bash
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          EOF

          chmod 600 "$HOME/.oci/config"

      - name: Test OCI authentication
        env:
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          echo "Testing OCI authentication..."
          oci os ns get >/dev/null
          echo "OCI authentication OK"

      - name: Check Oracle A1 capacity
        shell: bash
        env:
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          set -euo pipefail

          send_telegram() {
            local message="$1"
            curl --fail --silent --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${message}" \
              >/dev/null
          }

          echo "=========================================="
          echo " Oracle A1 Hunter"
          echo "=========================================="
          echo ""
          echo "Checking latest Resource Manager job..."

          JOBS="$(
            oci resource-manager job list \
              --stack-id "$OCI_STACK_ID" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --limit 1
          )"

          SHOULD_APPLY=false

          if [ -z "$(echo "$JOBS" | tr -d '[:space:]')" ]; then
            echo "No previous jobs found."
            SHOULD_APPLY=true
          else
            COUNT="$(
              echo "$JOBS" |
              jq -r 'if (.data | type) == "array" then (.data | length) else 0 end'
            )"

            if [ "$COUNT" -eq 0 ]; then
              echo "No previous jobs found."
              SHOULD_APPLY=true
            else
              STATE="$(echo "$JOBS" | jq -r '.data[0]["lifecycle-state"] // empty')"
              JOB_ID="$(echo "$JOBS" | jq -r '.data[0].id // empty')"

              echo "Latest job: $JOB_ID"
              echo "State: $STATE"
              echo ""

              case "$STATE" in
                SUCCEEDED)
                  echo "=========================================="
                  echo " SUCCESS"
                  echo " Oracle A1 has been provisioned."
                  echo "=========================================="

                  MADRID_TIME="$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"

                  printf -v MESSAGE '%s\n' \
                    "🎉 ¡Oracle A1 conseguida!" \
                    "" \
                    "El Stack de Oracle ha terminado correctamente." \
                    "Región: ${OCI_REGION}" \
                    "Estado: SUCCEEDED" \
                    "Fecha: ${MADRID_TIME}" \
                    "" \
                    "A1 Hunter se va a detener automáticamente para no realizar más intentos."

                  send_telegram "$MESSAGE"

                  echo "Telegram success notification sent."
                  echo "Disabling this workflow..."

                  curl --fail --silent --show-error \
                    -X PUT \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/oracle-a1.yml/disable" \
                    >/dev/null

                  echo "Workflow disabled."
                  exit 0
                  ;;

                ACCEPTED|IN_PROGRESS|CANCELING)
                  echo "A Resource Manager job is still running."
                  echo "Skipping this cycle."
                  exit 0
                  ;;

                FAILED)
                  echo "Previous Apply failed."
                  echo "Reading Terraform logs..."
                  echo ""

                  LOGS="$(
                    oci resource-manager job get-job-logs-content \
                      --job-id "$JOB_ID" 2>&1 || true
                  )"

                  if echo "$LOGS" | grep -Eqi "out of host capacity|out of capacity"; then
                    echo "A1 capacity unavailable."
                    echo "Retry allowed."
                    SHOULD_APPLY=true
                  else
                    echo "=========================================="
                    echo " NON-CAPACITY ERROR"
                    echo " Automatic retries stopped for this run."
                    echo "=========================================="
                    echo ""
                    echo "$LOGS" | tail -n 100

                    MADRID_TIME="$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"

                    printf -v MESSAGE '%s\n' \
                      "⚠️ Oracle A1 Hunter ha encontrado un error distinto a falta de capacidad." \
                      "" \
                      "Estado: FAILED" \
                      "Región: ${OCI_REGION}" \
                      "Fecha: ${MADRID_TIME}" \
                      "" \
                      "Revisa GitHub Actions / Oracle Resource Manager porque este error no se reintentará automáticamente en esta ejecución."

                    send_telegram "$MESSAGE" || true

                    exit 1
                  fi
                  ;;

                CANCELED)
                  echo "Previous job was canceled."
                  echo "Not retrying automatically."
                  exit 1
                  ;;

                *)
                  echo "Unexpected state: '$STATE'"
                  echo "Raw OCI response:"
                  echo "$JOBS"
                  exit 1
                  ;;
              esac
            fi
          fi

          if [ "$SHOULD_APPLY" = true ]; then
            echo ""
            echo "Launching Terraform Apply..."

            NEW_JOB="$(
              oci resource-manager job create-apply-job \
                --stack-id "$OCI_STACK_ID" \
                --execution-plan-strategy AUTO_APPROVED
            )"

            NEW_JOB_ID="$(echo "$NEW_JOB" | jq -r '.data.id')"

            echo ""
            echo "=========================================="
            echo " New attempt launched"
            echo " Job: $NEW_JOB_ID"
            echo "=========================================="
            echo ""
            echo "The next GitHub Actions run will check it."
          fi

  daily-report:
    if: github.event.schedule == '13 18 * * *' || github.event.schedule == '13 19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Madrid time
        id: madrid_time
        shell: bash
        run: |
          LOCAL_HOUR="$(TZ=Europe/Madrid date '+%H')"
          LOCAL_TIME="$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          echo "hour=$LOCAL_HOUR" >> "$GITHUB_OUTPUT"
          echo "time=$LOCAL_TIME" >> "$GITHUB_OUTPUT"
          echo "Madrid time: $LOCAL_TIME"

      - name: Install OCI CLI
        if: steps.madrid_time.outputs.hour == '20'
        run: |
          python -m pip install --quiet --disable-pip-version-check oci-cli

      - name: Configure OCI
        if: steps.madrid_time.outputs.hour == '20'
        shell: bash
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          key_file=$HOME/.oci/oci_api_key.pem
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          EOF

          chmod 600 "$HOME/.oci/config"

      - name: Send daily Telegram report
        if: steps.madrid_time.outputs.hour == '20'
        shell: bash
        env:
          OCI_STACK_ID: ${{ secrets.OCI_STACK_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          set -euo pipefail

          send_telegram() {
            local message="$1"
            curl --fail --silent --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${message}" \
              >/dev/null
          }

          MADRID_TIME="$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"

          JOBS="$(
            oci resource-manager job list \
              --stack-id "$OCI_STACK_ID" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --limit 1
          )"

          ALL_JOBS="$(
            oci resource-manager job list \
              --stack-id "$OCI_STACK_ID" \
              --all
          )"

          ATTEMPTS="$(echo "$ALL_JOBS" | jq -r 'if (.data | type) == "array" then (.data | length) else 0 end')"

          if [ -z "$(echo "$JOBS" | tr -d '[:space:]')" ]; then
            STATE="NO_JOBS"
          else
            STATE="$(echo "$JOBS" | jq -r '.data[0]["lifecycle-state"] // "UNKNOWN"')"
          fi

          if [ "$STATE" = "SUCCEEDED" ]; then
            echo "A1 is already provisioned; no daily failure report needed."
            exit 0
          fi

          printf -v MESSAGE '%s\n' \
            "⏳ Oracle A1: todavía sin suerte hoy." \
            "" \
            "Último estado: ${STATE}" \
            "Intentos registrados: ${ATTEMPTS}" \
            "Región: ${OCI_REGION}" \
            "Fecha: ${MADRID_TIME}" \
            "" \
            "El bot sigue intentando automáticamente cada ~5 minutos. Te avisaré en cuanto lo consiga."

          send_telegram "$MESSAGE"
          echo "Daily Telegram report sent."
